spring:
  application:
    name: project-piec1

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-1e0862a3-erp-agro.k.aivencloud.com}:${DB_PORT:15530}/${DB_NAME:defaultdb}?sslMode=REQUIRED
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:avnadmin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

api:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    device:
      key: ${DEVICE_API_KEY}
    token:
      secret: ${JWT_SECRET}